name: Deploy to cPanel (FTP)

on:
  push:
    branches:
      - main
      - master # In case the main branch is named master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Obtenir le code source
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Installer et Compiler le Frontend (Angular)
        run: |
          cd unjci-front
          npm ci --legacy-peer-deps
          npm test -- --watch=false
          npx ng build --configuration production

      - name: ⚙️ Setup PHP (Backend)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3

      - name: 📦 Installer les dépendances du Backend (Laravel)
        run: |
          cd unjci-api
          composer install --prefer-dist --no-interaction --optimize-autoloader
          php vendor/phpunit/phpunit/phpunit
          composer install --no-dev --no-interaction --optimize-autoloader

      - name: 📁 Préparer le dossier de déploiement
        run: |
          mkdir deployment-package
          
          # Copier le backend préparé (cœur Laravel)
          cp -R unjci-api/ deployment-package/unjci-api/
          find deployment-package/unjci-api/bootstrap/cache -name '*.php' -delete
          rm -f deployment-package/unjci-api/.env deployment-package/unjci-api/.env.testing
          printf 'Require all denied\n' > deployment-package/unjci-api/.htaccess
          # Nettoyer les fichiers de développement du backend
          rm -rf deployment-package/unjci-api/tests
          rm -rf deployment-package/unjci-api/node_modules || true
          
          # Créer le dossier public api/ et modifier index.php pour pointer vers unjci-api/
          mkdir -p deployment-package/api
          cp -R unjci-api/public/* deployment-package/api/
          cp unjci-api/public/.htaccess deployment-package/api/ || true
          sed -i "s|__DIR__.'/../|__DIR__.'/../unjci-api/|g" deployment-package/api/index.php
          
          # Copier les fichiers compilés du frontend à la racine du package
          cp -R unjci-front/dist/unjci-membership/browser/* deployment-package/
          cp tools/deployment-root.htaccess deployment-package/.htaccess

      - name: 🚀 Déploiement via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SECRET_1 }}
          username: ${{ secrets.SECRET_2 }}
          password: ${{ secrets.SECRET_3 }}
          local-dir: ./deployment-package/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/storage/**
            **/tests/**
