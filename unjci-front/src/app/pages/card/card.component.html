<!-- C'est ce conteneur qui va empêcher le contenu de passer sous le menu -->
<div class="carte-page-wrapper">

  <div class="card-container" *ngIf="member && member.status === 'approved'; else notActive">
    <div class="unjci-id-card">
      <!-- Section Photo avec les carrés oranges -->
      <div class="photo-wrapper">
        <div class="orange-square top-right"></div>
        <div class="photo-frame">
          <img *ngIf="member.photo_file_path" [src]="storageUrl + '/' + member.photo_file_path" alt="Photo" />
          <span *ngIf="!member.photo_file_path">photo</span>
        </div>
        <div class="orange-square bottom-left"></div>
      </div>

      <!-- Informations -->
      <div class="info-section">
        <h2 class="name">{{ member.last_name | uppercase }} {{ member.first_name }}</h2>
        <p class="function">{{ member.function_title || 'Journaliste' }}</p>
        <div class="badge-membre">MEMBRE</div>
      </div>

      <!-- Pied de carte -->
      <div class="footer-section">
        <div class="qr-code">
          <qrcode [qrdata]="qrCodeUrl" [width]="80" [errorCorrectionLevel]="'M'"></qrcode>
        </div>
        <div class="logo">
          <img src="assets/images/logo.jpg" alt="UNJCI" width="100" />
        </div>
      </div>
    </div>
  </div>

  <ng-template #notActive>
    <!-- J'ai ajouté un peu de style CSS dans la classe ci-dessous pour que le message soit plus joli -->
    <div class="not-active-msg alert-box">
      <p>Votre carte n'est pas encore disponible ou votre compte est en attente de validation.</p>
    </div>
  </ng-template>

</div>
