<header class="modern-header" [class.scrolled]="isScrolled">
  <div class="header-container">
    <!-- Logo -->
    <a routerLink="/" class="brand-logo" (click)="closeMenu()">
      <img src="assets/images/logo.jpg" alt="Logo UNJCI" />
    </a>

    <!-- Navigation Principale -->
    <nav class="main-nav" [class.active]="isMenuOpen">
      <!-- Accueil (Visible pour tous) -->
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        (click)="closeMenu()"
      >
        Accueil
      </a>
      
      <!-- Adhésion (Visible UNIQUEMENT si déconnecté) -->
      <a
        *ngIf="!session"
        routerLink="/guide-adhesion"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
      >
        Adhésion
      </a>
      <a
        routerLink="/renouvellement"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
      >
        Renouvellement
      </a>

      <!-- Nous contacter (Visible pour tous) -->
      <a
        routerLink="/nous-contacter"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
      >
        Nous contacter
      </a>
      
      <!-- Ma carte (Visible UNIQUEMENT pour les membres) -->
      <a
        *ngIf="role === 'member'"
        routerLink="/ma-carte"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
      >
        Ma carte
      </a>

      <!-- Scanner une carte (Visible UNIQUEMENT pour Admin et Scanner) -->
      <a
        *ngIf="role === 'admin' || role === 'scanner'"
        routerLink="/scanner"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
      >
        Scanner une carte
      </a>
    </nav>

    <!-- Actions (Boutons Dynamiques) -->
    <!-- Actions (Boutons Dynamiques) -->
    <div class="header-actions">

      <!-- Bouton VISITEUR : pointe vers login -->
      <a *ngIf="!session" routerLink="/login" class="btn-login" (click)="closeMenu()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        mon espace
      </a>

      <!-- Bouton MEMBRE -->
      <a *ngIf="role === 'member'" routerLink="/espace-membre" class="btn-login" (click)="closeMenu()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        Espace membre
      </a>

      <!-- Bouton ADMIN -->
      <a *ngIf="role === 'admin'" routerLink="/administration" class="btn-login" (click)="closeMenu()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        Espace admin
      </a>

      <!-- BOUTON DÉCONNEXION (Icône Uniquement) -->
      <button *ngIf="session"
              style="color: #ef4444; background: transparent; border: none; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center;"
              (click)="logout()"
              title="Déconnexion">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
      </button>

      <!-- Bouton Menu Mobile -->
      <button class="mobile-menu-btn" (click)="toggleMenu()" [class.is-open]="isMenuOpen">
        <svg class="icon-menu" fill="none" stroke="#1e293b" viewBox="0 0 24 24" width="32" height="32">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <svg class="icon-close" fill="none" stroke="#1e293b" viewBox="0 0 24 24" width="32" height="32">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
