<header class="modern-header" [class.scrolled]="isScrolled">
  <div class="header-container">
    <!-- Logo (ferme le menu si on clique dessus depuis le mobile) -->
    <a routerLink="/" class="brand-logo" (click)="closeMenu()">
      <img src="./assets/images/logo.jpg" alt="Logo UNJCI" />
    </a>

    <!-- Navigation Principale (S'active via isMenuOpen) -->
   <!-- Navigation Principale (S'active via isMenuOpen) -->
    <nav class="main-nav" [class.active]="isMenuOpen">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        (click)="closeMenu()"
      >
        Accueil
      </a>
      
      <!-- Adhésion : visible UNIQUEMENT si déconnecté -->
      <a 
        *ngIf="!isLoggedIn" 
        routerLink="/application" 
        routerLinkActive="active" 
        class="nav-link" 
        (click)="closeMenu()"
      >
        Adhésion
      </a>
      
      <a
        routerLink="/nous-contacter"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
      >
        Nous contacter
      </a>
      
      <!-- Ma carte : visible UNIQUEMENT si connecté -->
      <a
        *ngIf="isLoggedIn"
        routerLink="/ma-carte"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMenu()"
      >
        Ma carte
      </a>
    </nav>

    <!-- Actions (Connexion / Espace Membre) -->
    <div class="header-actions">
      <!-- Bouton dynamique : pointe vers /login ou le tableau de bord adéquat -->
      <a [routerLink]="dashboardLink" class="btn-login" (click)="closeMenu()">
        <svg
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          ></path>
        </svg>
        mon espace
      </a>

      <!-- Bouton Menu Mobile -->
      <button class="mobile-menu-btn" (click)="toggleMenu()" [class.is-open]="isMenuOpen">
        <!-- Icône Hamburger -->
        <svg
          class="icon-menu"
          fill="none"
          stroke="#1e293b"
          viewBox="0 0 24 24"
          width="32"
          height="32"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>

        <!-- Icône Croix (Cachée par défaut) -->
        <svg
          class="icon-close"
          fill="none"
          stroke="#1e293b"
          viewBox="0 0 24 24"
          width="32"
          height="32"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer class="modern-footer">
  Prototype UNJCI • Les données sont stockées localement dans le navigateur.
</footer>
